services:
  hardware:
    image: mdd-sim-gateway/hardware:dev
    container_name: mdd-hardware-lab
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, DAC_OVERRIDE]
    volumes:
      - /dev:/dev
      - mdd-hardware-data:/data
      - mdd-pcscd:/run/pcscd
    device_cgroup_rules:
      - "c 188:* rwm"
      - "c 180:* rwm"
      - "c 189:* rwm"
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /var/lib/ModemManager:rw,nosuid,nodev,size=8m
      - /var/lib/mdd-vpcd:rw,nosuid,nodev,exec,size=4m
      - /etc/reader.conf.d:rw,nosuid,nodev,size=1m
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  mdd-hardware-data:
  mdd-pcscd:
