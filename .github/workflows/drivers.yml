name: Driver packs

# Rebuild the Synology driver pack whenever an input changes, and prove it still reproduces the
# modules validated on hardware. The Release workflow runs the same script to publish it.
on:
  pull_request:
    paths:
      - drivers/packs/**
      - runtime/synology-v1000-7.4-modules.json
      - runtime/synology-load-modules.sh
      - tools/drivers/**
      - .github/workflows/drivers.yml
  push:
    branches: [develop, main]
    paths:
      - drivers/packs/**
      - runtime/synology-v1000-7.4-modules.json
      - runtime/synology-load-modules.sh
      - tools/drivers/**
      - .github/workflows/drivers.yml

permissions:
  contents: read

jobs:
  synology-ds1621plus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild and verify against the validated modules
        run: sh tools/drivers/build-synology-pack.sh dist
      - name: The pack's own checksum matches the catalogue
        run: |
          set -eu
          python3 tools/validate_nas_catalog.py
          expected=$(python3 -c "import json;print(json.load(open('drivers/catalog/synology-ds1621plus-dsm-7.4.1-90080-k4.4.302plus-x86_64.json'))['driver_pack']['sha256'] or '')")
          actual=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)
          echo "pack sha256: $actual"
          if [ -n "$expected" ] && [ "$expected" != "$actual" ]; then
            echo "catalogue pins $expected" >&2; exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: driver-pack-synology-ds1621plus
          path: dist/*.tar.gz
          if-no-files-found: error
