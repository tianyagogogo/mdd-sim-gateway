name: NAS hardware compatibility
description: Submit a redacted NAS, OS, kernel and USB-device compatibility report
title: "[NAS compatibility] Vendor Model / OS build"
labels: [hardware, compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Please remove serial numbers, MAC/public addresses, usernames, IMSI, ICCID, IMEI, EID,
        phone numbers, SIM PINs, subscription URLs, tokens and keys. Do not attach `lsusb -v`
        or an unreviewed full diagnostic bundle.
  - type: input
    id: nas
    attributes:
      label: NAS vendor and exact model
      placeholder: Synology DS1621+
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: CPU platform and architecture
      description: Use the vendor platform name when available, plus `uname -m`.
      placeholder: v1000 / x86_64
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating-system version and complete build
      placeholder: DSM 7.4.1-90080
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel release
      description: Output of `uname -r` only.
      placeholder: 4.4.302+
    validations:
      required: true
  - type: textarea
    id: usb
    attributes:
      label: USB devices
      description: List only VID:PID, generic product name and device type. Do not include serial numbers.
      placeholder: "2c7c:0125 — cellular modem"
    validations:
      required: true
  - type: textarea
    id: nodes
    attributes:
      label: Device nodes created after insertion
      description: Report names such as ttyUSB, ttyACM, cdc-wdm, wwan and /dev/bus/usb. Do not paste unrestricted logs.
      placeholder: "ttyUSB0-3, cdc-wdm0 and wwan0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Full-container Compose
        - Existing install.sh / host-assisted
        - Not installed yet
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Functions tested and result
      description: Include the exact MDD version and results for discovery, reader, VoWiFi, 4G, SMS, calls or eSIM as applicable.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed all device and subscriber identifiers, credentials, URLs and keys.
          required: true
